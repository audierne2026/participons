name: Feed Mistral RAG

on:
  workflow_dispatch:
    inputs:
      sync_to_ocapistaine:
        description: 'Push documents.jsonl to ocapistaine dev branch'
        type: boolean
        default: true
      upload_to_mistral:
        description: 'Upload dataset to Mistral API'
        type: boolean
        default: false

jobs:
  feed-rag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests python-dotenv

      # ==================== STEP 1: Export Contributions ====================
      - name: Export contributions to markdown
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📄 Exporting GitHub contributions to markdown files..."
          python scripts/export_contributions_to_md.py --clean

      # ==================== STEP 2: Prepare RAG Dataset ====================
      - name: Prepare RAG dataset (full documents)
        run: |
          echo "📚 Preparing RAG dataset with full documents..."
          python scripts/prepare_rag_dataset.py --output data/rag/documents.jsonl

      # ==================== STEP 3: Prepare Fine-tuning Dataset ====================
      - name: Prepare Mistral fine-tuning dataset
        run: |
          echo "🤖 Preparing JSONL dataset for Mistral fine-tuning..."
          python scripts/prepare_mistral_dataset.py --output data/mistral/dataset.jsonl

      # ==================== STEP 4: Upload Artifacts ====================
      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: mistral-rag-data
          path: |
            data/rag/*.jsonl
            data/rag/*.json
            data/mistral/*.jsonl
            data/mistral/*.json
          retention-days: 30

      # ==================== STEP 5: Sync to OCapistaine (dev branch) ====================
      - name: Push RAG dataset to ocapistaine dev branch
        if: ${{ inputs.sync_to_ocapistaine == true }}
        env:
          OCAP_LOCKI_TOKEN: ${{ secrets.OCAP_LOCKI_TOKEN }}
        run: |
          if [ -z "$OCAP_LOCKI_TOKEN" ]; then
            echo "❌ OCAP_LOCKI_TOKEN not set"
            exit 1
          fi

          echo "🔄 Syncing RAG dataset to locki-io/ocapistaine (dev branch)..."

          # Clone ocapistaine dev branch (shallow)
          git clone --depth 1 --branch dev \
            "https://ocapistaine:${OCAP_LOCKI_TOKEN}@github.com/locki-io/ocapistaine.git" \
            /tmp/ocapistaine

          # Copy RAG dataset
          mkdir -p /tmp/ocapistaine/data/audierne2026/rag
          cp data/rag/documents.jsonl /tmp/ocapistaine/data/audierne2026/rag/
          cp data/rag/documents_metadata.json /tmp/ocapistaine/data/audierne2026/rag/

          # Commit and push to dev
          cd /tmp/ocapistaine
          git config user.name "ocapistaine"
          git config user.email "ocapistaine@users.noreply.github.com"
          git add data/audierne2026/rag/
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to push (dataset unchanged)"
          else
            DOCS=$(python3 -c "import json;d=json.load(open('data/audierne2026/rag/documents_metadata.json'));print(d.get('total_documents',0))")
            WORDS=$(python3 -c "import json;d=json.load(open('data/audierne2026/rag/documents_metadata.json'));print(d.get('total_words',0))")
            git commit -m "chore(rag): sync audierne2026 documents.jsonl (${DOCS} docs, ${WORDS} words)

            Automated sync from audierne2026/participons workflow.
            Branch: ${{ github.ref_name }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push origin dev
            echo "✅ Pushed to locki-io/ocapistaine dev branch"
          fi

      # ==================== STEP 6: Notify jnschilling ====================
      - name: Notify RAG update
        if: ${{ inputs.sync_to_ocapistaine == true }}
        env:
          OCAP_LOCKI_TOKEN: ${{ secrets.OCAP_LOCKI_TOKEN }}
        run: |
          # Read stats for notification
          DOCS=$(python3 -c "import json;d=json.load(open('data/rag/documents_metadata.json'));print(d.get('total_documents',0))" 2>/dev/null || echo "?")
          WORDS=$(python3 -c "import json;d=json.load(open('data/rag/documents_metadata.json'));print(d.get('total_words',0))" 2>/dev/null || echo "?")
          BRANCH="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          BODY="## 🔄 RAG Dataset Updated

          **Source**: audierne2026/participons (branch: \`${BRANCH}\`)
          **Documents**: ${DOCS} | **Words**: ${WORDS}
          **Workflow run**: [View logs](${RUN_URL})

          The \`documents.jsonl\` has been pushed to \`locki-io/ocapistaine\` **dev** branch at \`data/audierne2026/rag/\`.

          > Merge dev → main when ready."

          # Post comment on participons discussion #24 (Toutes les contributions)
          curl -s -X POST \
            -H "Authorization: token $OCAP_LOCKI_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/audierne2026/participons/issues/24/comments" \
            -d "$(python3 -c "import json;print(json.dumps({'body': '''${BODY}'''}))")" \
            > /dev/null && echo "✅ Notification posted to discussion #24" || echo "⚠️  Notification failed (non-blocking)"

      # ==================== STEP 7: Upload to Mistral (Optional) ====================
      - name: Upload files to Mistral API
        if: ${{ inputs.upload_to_mistral == true }}
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -z "$MISTRAL_API_KEY" ]; then
            echo "❌ MISTRAL_API_KEY not set"
            exit 1
          fi

          echo "📚 Uploading RAG dataset to Mistral..."
          RAG_RESPONSE=$(curl -s -X POST "https://api.mistral.ai/v1/files" \
            -H "Authorization: Bearer $MISTRAL_API_KEY" \
            -F "file=@data/rag/documents.jsonl" \
            -F "purpose=retrieval")

          echo "$RAG_RESPONSE" | tee upload_rag.json
          RAG_ID=$(echo "$RAG_RESPONSE" | jq -r '.id // empty')

          echo ""
          echo "📤 Uploading training dataset to Mistral..."
          TRAIN_RESPONSE=$(curl -s -X POST "https://api.mistral.ai/v1/files" \
            -H "Authorization: Bearer $MISTRAL_API_KEY" \
            -F "file=@data/mistral/dataset_train.jsonl" \
            -F "purpose=fine-tune")

          echo "$TRAIN_RESPONSE" | tee upload_train.json
          TRAIN_ID=$(echo "$TRAIN_RESPONSE" | jq -r '.id // empty')

          echo ""
          echo "📤 Uploading validation dataset to Mistral..."
          VAL_RESPONSE=$(curl -s -X POST "https://api.mistral.ai/v1/files" \
            -H "Authorization: Bearer $MISTRAL_API_KEY" \
            -F "file=@data/mistral/dataset_val.jsonl" \
            -F "purpose=fine-tune")

          echo "$VAL_RESPONSE" | tee upload_val.json
          VAL_ID=$(echo "$VAL_RESPONSE" | jq -r '.id // empty')

          echo ""
          echo "============================================"
          echo "✅ Upload complete!"
          echo "   RAG file ID: $RAG_ID"
          echo "   Train file ID: $TRAIN_ID"
          echo "   Validation file ID: $VAL_ID"
          echo "============================================"

      # ==================== STEP 8: Summary ====================
      - name: Generate summary
        run: |
          echo ""
          echo "============================================"
          echo "📊 Feed Mistral RAG - Summary"
          echo "============================================"
          echo ""

          echo "📁 Contributions exported:"
          if [ -f "docs/.contributions_export_metadata.json" ]; then
            cat docs/.contributions_export_metadata.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(f'   Issues: {data.get(\"issues_exported\", 0)}')
          print(f'   Discussions: {data.get(\"discussions_exported\", 0)}')
          print(f'   Files created: {data.get(\"files_created\", 0)}')
          "
          fi

          echo ""
          echo "📚 RAG dataset (full documents):"
          if [ -f "data/rag/documents_metadata.json" ]; then
            cat data/rag/documents_metadata.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(f'   Total documents: {data.get(\"total_documents\", 0)}')
          print(f'   - READMEs: {data.get(\"by_type\", {}).get(\"readme\", 0)}')
          print(f'   - Contributions: {data.get(\"by_type\", {}).get(\"contribution\", 0)}')
          print(f'   - PDF extracts: {data.get(\"by_type\", {}).get(\"pdf_extract\", 0)}')
          print(f'   Total words: {data.get(\"total_words\", 0):,}')
          "
          fi

          echo ""
          echo "🤖 Fine-tuning dataset (Q&A pairs):"
          if [ -f "data/mistral/dataset_metadata.json" ]; then
            cat data/mistral/dataset_metadata.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(f'   Total Q&A pairs: {data.get(\"total_pairs\", 0)}')
          print(f'   Train: {data.get(\"train_pairs\", 0)}')
          print(f'   Validation: {data.get(\"val_pairs\", 0)}')
          "
          fi

          echo ""
          echo "============================================"
          echo ""
          echo "💡 To extract PDFs locally, run:"
          echo "   export MISTRAL_OCR_API_KEY='your-key'"
          echo "   python scripts/extract_pdf_with_mistral.py"
          echo "============================================"
